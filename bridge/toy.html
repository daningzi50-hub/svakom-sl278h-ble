<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SL278H BLE Bridge</title>
<style>body{font-family:sans-serif;max-width:500px;margin:40px auto;padding:20px;background:#1a1a2e;color:#e0e0e0}
button{background:#e94560;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:16px;cursor:pointer;margin:8px 4px}
button:disabled{opacity:.4}
#log{background:#0f0f23;padding:12px;border-radius:8px;height:200px;overflow-y:auto;font-size:13px;font-family:monospace;margin-top:16px}
.ok{color:#4ecca3}.err{color:#e94560}.info{color:#8899aa}
h2{color:#e94560}
</style></head><body>
<h2>SL278H BLE Bridge</h2>
<button id="connectBtn" onclick="connectBLE()">Connect Toy</button>
<button id="stopBtn" onclick="sendStop()" disabled>Stop</button>
<button id="heatBtn" onclick="toggleHeat()" disabled>Heat</button>
<div id="status" style="margin:12px 0;font-size:14px" class="info">Not connected</div>
<div id="log"></div>
<script>
const RELAY=location.origin;
const SVC='0000ffe0-0000-1000-8000-00805f9b34fb';
const WRITE='0000ffe1-0000-1000-8000-00805f9b34fb';
const KEEPALIVE=1500;
const MAX_RECONNECT=5;
let writeChar=null,currentCmd=null,currentUntil=0,pollTimer=null,kaTimer=null;
let bleDevice=null,reconnectCount=0;

function log(msg,cls='info'){
  const d=document.getElementById('log');
  d.innerHTML+=`<div class="${cls}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  d.scrollTop=d.scrollHeight;
}

async function connectBLE(){
  try{
    log('Scanning...');
    bleDevice=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'SL278'}],optionalServices:[SVC]});
    bleDevice.addEventListener('gattserverdisconnected',onDisconnected);
    await doConnect();
    reconnectCount=0;
  }catch(e){log('Error: '+e,'err');}
}

async function doConnect(){
  log('Connecting '+bleDevice.name+'...');
  const srv=await bleDevice.gatt.connect();
  const svc=await srv.getPrimaryService(SVC);
  writeChar=await svc.getCharacteristic(WRITE);
  log('Connected!','ok');
  document.getElementById('status').textContent='Connected';
  document.getElementById('status').className='ok';
  document.getElementById('connectBtn').disabled=true;
  document.getElementById('stopBtn').disabled=false;
  document.getElementById('heatBtn').disabled=false;
  startPolling();
  startKeepalive();
}

async function onDisconnected(){
  writeChar=null;
  if(reconnectCount>=MAX_RECONNECT){log('重连失败次数已达上限','err');return;}
  reconnectCount++;
  const delay=reconnectCount*2000;
  log(`断连，${delay/1000}s后第${reconnectCount}次重连...`,'info');
  document.getElementById('status').textContent=`Reconnecting (${reconnectCount}/${MAX_RECONNECT})...`;
  document.getElementById('status').className='info';
  await new Promise(r=>setTimeout(r,delay));
  try{await doConnect();log('重连成功','ok');reconnectCount=0;}
  catch(e){log('重连失败: '+e,'err');onDisconnected();}
}

function buildScale(v){return new Uint8Array([0x55,0x04,0,0,1,Math.max(0,Math.min(255,v)),0xAA]);}
function buildStop(){return new Uint8Array([0x55,0x04,0,0,0,0,0xAA]);}
function buildPattern(m,l){return new Uint8Array([0x55,0x03,0,0,Math.max(1,Math.min(8,m)),Math.max(1,Math.min(5,l)),0]);}
function buildClap(level){return new Uint8Array([0x55,0x07,0,0,Math.max(1,Math.min(7,level)),0,0]);}
function buildHeat(on){return on?new Uint8Array([0x55,0x05,0x01,0x37,0,0,0]):new Uint8Array([0x55,0x05,0,0,0,0,0]);}

async function writeBLE(buf){
  if(!writeChar)return;
  try{await writeChar.writeValueWithoutResponse(buf);}catch(e){log('Write err: '+e,'err');}
}

async function execCmd(c){
  if(c.raw){
    const bytes=new Uint8Array(c.raw.match(/.{2}/g).map(h=>parseInt(h,16)));
    currentCmd=bytes;currentUntil=c.sec?Date.now()+c.sec*1000:0;
    await writeBLE(bytes);log('Raw: '+c.raw,'ok');return;
  }
  if(c.stop){currentCmd=null;currentUntil=0;await writeBLE(buildStop());log('Stop','ok');return;}
  if(c.heat!=null){
    const on=!!c.heat;
    await writeBLE(buildHeat(on));log('Heat '+(on?'ON':'OFF'),'ok');return;
  }
  if(c.clap!=null){
    const lv=parseInt(c.clap);
    currentCmd=buildClap(lv);currentUntil=c.sec?Date.now()+c.sec*1000:0;
    await writeBLE(currentCmd);log('Clap level '+lv,'ok');return;
  }
  if(c.pattern!=null){
    const m=parseInt(c.pattern),l=Math.max(1,Math.round((c.level||0.6)*5));
    currentCmd=buildPattern(m,l);currentUntil=c.sec?Date.now()+c.sec*1000:0;
    await writeBLE(currentCmd);log('Pattern '+m+' level '+l,'ok');return;
  }
  const v=c.speed??c.suck??c.intensity;
  if(v!=null){
    if(parseFloat(v)<=0){currentCmd=null;currentUntil=0;await writeBLE(buildStop());log('Speed 0','ok');return;}
    currentCmd=buildScale(Math.round(parseFloat(v)*255));
    currentUntil=c.sec?Date.now()+c.sec*1000:0;
    await writeBLE(currentCmd);log('Speed '+Math.round(parseFloat(v)*100)+'%','ok');
  }
}

function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    try{
      const r=await fetch(RELAY+'/toy-next');
      const c=await r.json();
      if(c&&c.type!=='hello'&&Object.keys(c).length)await execCmd(c);
    }catch(e){}
  },300);
}

function startKeepalive(){
  if(kaTimer)clearInterval(kaTimer);
  kaTimer=setInterval(async()=>{
    if(currentUntil&&Date.now()>=currentUntil){
      currentCmd=null;currentUntil=0;await writeBLE(buildStop());log('Timer stop','info');return;
    }
    if(currentCmd)await writeBLE(currentCmd);
  },KEEPALIVE);
}

async function sendStop(){currentCmd=null;currentUntil=0;await writeBLE(buildStop());log('Manual stop','ok');}
let heatOn=false;
async function toggleHeat(){heatOn=!heatOn;await writeBLE(buildHeat(heatOn));log('Heat '+(heatOn?'ON':'OFF'),'ok');document.getElementById('heatBtn').textContent=heatOn?'Heat OFF':'Heat';}
</script></body></html>
